services:
  - type: web
    name: up-time
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: CONTACT_NOTIFY_EMAIL
        sync: false
      - key: EMAIL_WEBHOOK_URL
        sync: false
      - key: EMAIL_WEBHOOK_SECRET
        sync: false
      - key: BUSINESS_LEGAL_NAME
        sync: false
      - key: BUSINESS_CUIT
        sync: false
      - key: BUSINESS_ADDRESS
        sync: false
      - key: BUSINESS_EMAIL
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_SANDBOX
        value: "false"
      - key: RATELIMIT_STORAGE_URI
        fromService:
          name: up-time-ratelimit
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: up-time-ratelimit
    plan: free
    region: ohio
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
