<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso privado | Up Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #1b1e21; --surface: #22262a; --surface-2: #2a2f34; --line: #3a4046; --text: #edebe6; --muted: #a3aab0; --accent: #e8a33d; --accent-ink: #3a2a10; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: 'Source Sans 3', Arial, sans-serif; }
        main { width: min(90vw, 420px); padding: 2.2rem; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); box-shadow: 0 18px 40px -18px rgba(0,0,0,.7); }
        h1 { margin-top: 0; color: var(--text); font: 700 clamp(2rem, 5vw, 2.8rem)/1.05 'Archivo', Arial, sans-serif; letter-spacing: -.03em; }
        h1::before { content: 'UP TIME / '; color: var(--accent); font: 500 .72rem 'IBM Plex Mono', monospace; letter-spacing: .08em; display: block; margin-bottom: 1rem; }
        label { display: grid; gap: .4rem; margin-top: 1rem; color: var(--muted); }
        input, button { width: 100%; padding: .78rem; margin-top: .4rem; box-sizing: border-box; border-radius: 3px; }
        input { border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: 1rem 'Source Sans 3', Arial, sans-serif; }
        input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
        button { margin-top: 1.5rem; background: var(--accent); color: var(--accent-ink); border: 0; cursor: pointer; font: 600 1rem 'Source Sans 3', Arial, sans-serif; }
        button:hover { background: #f0b158; }
        .error { padding: .75rem; border-radius: 3px; background: rgba(181,62,62,.16); color: #ffaaa3; }
    </style>
</head>
<body>
    <main>
        <h1>Acceso privado</h1>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post" action="{{ url_for('admin_login_submit') }}">
            <label>Usuario <input name="username" required autocomplete="username"></label>
            <label>Contraseña <input type="password" name="password" required autocomplete="current-password"></label>
            <button type="submit">Ingresar</button>
        </form>
    </main>
</body>
</html>
