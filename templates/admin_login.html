<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso privado | Up Time</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0e27; color: #f5f5f5; font-family: Arial, sans-serif; }
        main { width: min(90vw, 380px); padding: 2rem; border: 1px solid #d4af37; border-radius: 12px; background: #1a1f3a; }
        h1 { color: #d4af37; margin-top: 0; }
        label { display: block; margin-top: 1rem; }
        input, button { width: 100%; padding: .75rem; margin-top: .4rem; box-sizing: border-box; }
        button { margin-top: 1.5rem; background: #d4af37; border: 0; cursor: pointer; font-weight: bold; }
        .error { color: #ff8992; }
    </style>
</head>
<body>
    <main>
        <h1>Acceso privado</h1>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post" action="{{ url_for('admin_login_submit') }}">
            <label>Usuario <input name="username" required autocomplete="username"></label>
            <label>Contraseña <input type="password" name="password" required autocomplete="current-password"></label>
            <button type="submit">Ingresar</button>
        </form>
    </main>
</body>
</html>
